version: '3.8'

services:
  postgres:
    build: .
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres-user
      POSTGRES_PASSWORD: postgres-password
      POSTGRES_DB: postgres-db
    ports:
      - "5432:5432"
    volumes:
      - ./DB_DDL:/docker-entrypoint-initdb.d/DB_DDL.sql
